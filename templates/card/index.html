<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Tarjeta — {{NAME}}</title>
  <style>
    @page { size: 90mm 50mm; margin: 0; }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    .card {
      width: 90mm;
      height: 50mm;
      padding: 6mm;
      font-family: "Segoe UI", Calibri, system-ui, sans-serif;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #1a1a1a;
      border: 0.3mm solid #1f4e79;
    }
    h1 { margin: 0; font-size: 14pt; }
    .role { margin: 2mm 0 0; font-size: 9pt; color: #1f4e79; font-weight: 600; }
    .url { margin: 3mm 0 0; font-size: 7pt; color: #5c6570; word-break: break-all; }
    .qr img { width: 28mm; height: 28mm; display: block; }
  </style>
</head>
<body>
  <div class="card">
    <div>
      <h1>{{NAME}}</h1>
      <p class="role">{{ROLE}}</p>
      <p class="url">{{PAGE_URL}}</p>
    </div>
    <div class="qr">
      <img src="qr.png" alt="QR al CV web" />
    </div>
  </div>
</body>
</html>
